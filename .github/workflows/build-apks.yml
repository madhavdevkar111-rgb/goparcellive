
name: Build GoParcel APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/goparcel/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GoParcel"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.goparcel.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.goparcel.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              flavorDimensions += 'role'

              productFlavors {
                  customer {
                      dimension 'role'
                      applicationIdSuffix '.customer'
                      manifestPlaceholders = [
                          appLabel: 'GoParcel Customer',
                          appIcon: '@drawable/ic_customer'
                      ]
                  }

                  rider {
                      dimension 'role'
                      applicationIdSuffix '.rider'
                      manifestPlaceholders = [
                          appLabel: 'GoParcel Rider',
                          appIcon: '@drawable/ic_rider'
                      ]
                  }

                  admin {
                      dimension 'role'
                      applicationIdSuffix '.admin'
                      manifestPlaceholders = [
                          appLabel: 'GoParcel Admin',
                          appIcon: '@android:drawable/sym_def_app_icon'
                      ]
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # Default Customer icon
          cat > app/src/main/res/drawable/ic_customer.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#1976D2"
                  android:pathData="M4,4h40v40h-40z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,16h24v19h-24z"/>
          </vector>
          EOF

          # Default Rider icon
          cat > app/src/main/res/drawable/ic_rider.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#2E7D32"
                  android:pathData="M4,4h40v40h-40z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M9,27h28v7h-28z"/>
          </vector>
          EOF

          # Use the actual PNG logos from repository root
          if [ -f ic_customer.png ]; then
            rm app/src/main/res/drawable/ic_customer.xml
            cp ic_customer.png app/src/main/res/drawable-nodpi/ic_customer.png
          else
            echo "Customer PNG not found"
          fi

          if [ -f ic_Rider.png ]; then
            rm app/src/main/res/drawable/ic_rider.xml
            cp ic_Rider.png app/src/main/res/drawable-nodpi/ic_rider.png
          else
            echo "Rider PNG not found"
          fi

          # Android Manifest
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>

              <application
                  android:allowBackup="false"
                  android:label="${appLabel}"
                  android:icon="${appIcon}"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity Java
          cat > app/src/main/java/com/goparcel/app/MainActivity.java <<'EOF'
          package com.goparcel.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingWebPermission;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;

              private static final int FILE_PICKER = 101;
              private static final int APP_PERMISSIONS = 102;
              private static final int WEB_CAMERA_PERMISSION = 103;
              private static final int WEB_LOCATION_PERMISSION = 104;
              private static final int RIDER_OVERLAY_SETTINGS = 201;
              private static final int RIDER_BATTERY_SETTINGS = 202;

              private String appUrl() {
                  String id = getPackageName();

                  if (id.endsWith(".customer")) {
                      return "https://madhavdevkar111-rgb.github.io/goparcellive/Customer/";
                  }

                  if (id.endsWith(".rider")) {
                      return "https://madhavdevkar111-rgb.github.io/goparcellive/Rider/";
                  }

                  return "https://madhavdevkar111-rgb.github.io/goparcellive/Admin/";
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {

                          if (hasLocationPermission()) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;

                              requestPermissions(new String[]{
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                              }, WEB_LOCATION_PERMISSION);
                          }
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {

                          String host = request.getOrigin().getHost();

                          if (host == null ||
                              !host.equals("madhavdevkar111-rgb.github.io")) {
                              request.deny();
                              return;
                          }

                          boolean camera = false;

                          for (String resource : request.getResources()) {
                              if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                  camera = true;
                              }
                          }

                          if (camera &&
                              checkSelfPermission(Manifest.permission.CAMERA)
                              != PackageManager.PERMISSION_GRANTED) {

                              pendingWebPermission = request;

                              requestPermissions(
                                  new String[]{Manifest.permission.CAMERA},
                                  WEB_CAMERA_PERMISSION
                              );

                          } else if (camera) {

                              request.grant(new String[]{
                                  PermissionRequest.RESOURCE_VIDEO_CAPTURE
                              });

                          } else {
                              request.deny();
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          try {
                              startActivityForResult(
                                  params.createIntent(),
                                  FILE_PICKER
                              );
                              return true;

                          } catch (Exception e) {
                              fileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });

                  requestInitialPermissions();

                  if (savedInstanceState == null) {
                      webView.loadUrl(appUrl());
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(
                      Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED
                  ||
                  checkSelfPermission(
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestInitialPermissions() {

                  java.util.ArrayList<String> list =
                      new java.util.ArrayList<>();

                  if (!hasLocationPermission()) {
                      list.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      list.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  }

                  if (checkSelfPermission(Manifest.permission.CAMERA)
                      != PackageManager.PERMISSION_GRANTED) {
                      list.add(Manifest.permission.CAMERA);
                  }

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED) {
                      list.add(Manifest.permission.POST_NOTIFICATIONS);
                  }

                  if (!list.isEmpty()) {
                      requestPermissions(
                          list.toArray(new String[0]),
                          APP_PERMISSIONS
                      );
                  } else {
                      requestRiderSpecialPermissions();
                  }
              }

              private void requestRiderSpecialPermissions() {

                  if (!getPackageName().endsWith(".rider")) {
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      !Settings.canDrawOverlays(this)) {

                      Intent intent = new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getPackageName())
                      );

                      startActivityForResult(
                          intent,
                          RIDER_OVERLAY_SETTINGS
                      );
                      return;
                  }

                  requestRiderBatteryPermission();
              }

              private void requestRiderBatteryPermission() {

                  if (!getPackageName().endsWith(".rider")) {
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {

                      PowerManager pm = (PowerManager)
                          getSystemService(Context.POWER_SERVICE);

                      if (!pm.isIgnoringBatteryOptimizations(
                          getPackageName())) {

                          Intent intent = new Intent(
                              Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                              Uri.parse("package:" + getPackageName())
                          );

                          startActivityForResult(
                              intent,
                              RIDER_BATTERY_SETTINGS
                          );
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results) {

                  super.onRequestPermissionsResult(
                      requestCode, permissions, results
                  );

                  if (requestCode == APP_PERMISSIONS) {
                      requestRiderSpecialPermissions();
                  }

                  if (requestCode == WEB_LOCATION_PERMISSION &&
                      pendingGeoCallback != null) {

                      pendingGeoCallback.invoke(
                          pendingGeoOrigin,
                          hasLocationPermission(),
                          false
                      );

                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                  }

                  if (requestCode == WEB_CAMERA_PERMISSION &&
                      pendingWebPermission != null) {

                      if (checkSelfPermission(Manifest.permission.CAMERA)
                          == PackageManager.PERMISSION_GRANTED) {

                          pendingWebPermission.grant(new String[]{
                              PermissionRequest.RESOURCE_VIDEO_CAPTURE
                          });

                      } else {
                          pendingWebPermission.deny();
                      }

                      pendingWebPermission = null;
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_PICKER && fileCallback != null) {

                      Uri[] result =
                          WebChromeClient.FileChooserParams.parseResult(
                              resultCode, data
                          );

                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }

                  if (requestCode == RIDER_OVERLAY_SETTINGS) {
                      requestRiderBatteryPermission();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Verify icons
        run: |
          ls -l ic_customer.png ic_Rider.png
          file ic_customer.png ic_Rider.png

      - name: Build Customer Rider Admin
        run: gradle --no-daemon assembleCustomerDebug assembleRiderDebug assembleAdminDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: GoParcel-Android-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

