
name: Build GoParcel APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'Customer/**'
      - 'Rider/**'
      - 'Admin/**'
      - 'shared/**'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/goparcel/mobile
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'GoParcelMobile'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.goparcel.mobile'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.goparcel.mobile'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              flavorDimensions 'panel'

              productFlavors {
                  customer {
                      dimension 'panel'
                      applicationIdSuffix '.customer'
                      resValue 'string', 'app_name', 'GoParcel Customer'
                      buildConfigField 'String', 'START_URL', '"https://madhavdevkar111-rgb.github.io/goparcellive/Customer/"'
                  }
                  rider {
                      dimension 'panel'
                      applicationIdSuffix '.rider'
                      resValue 'string', 'app_name', 'GoParcel Rider'
                      buildConfigField 'String', 'START_URL', '"https://madhavdevkar111-rgb.github.io/goparcellive/Rider/"'
                  }
                  admin {
                      dimension 'panel'
                      applicationIdSuffix '.admin'
                      resValue 'string', 'app_name', 'GoParcel Admin'
                      buildConfigField 'String', 'START_URL', '"https://madhavdevkar111-rgb.github.io/goparcellive/Admin/"'
                  }
              }

              buildFeatures {
                  buildConfig true
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/goparcel/mobile/MainActivity.java <<'EOF'
          package com.goparcel.mobile;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl(BuildConfig.START_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APKs
        run: gradle assembleCustomerDebug assembleRiderDebug assembleAdminDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: GoParcel-Android-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
