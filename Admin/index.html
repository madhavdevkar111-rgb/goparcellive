<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoParcel - Master Control Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0d0f12; color: #f5f5f5; }
    header { background: linear-gradient(135deg, #000000 65%, #261200 100%); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff6600; }
    header h1 { color: #ff6600; font-size: 20px; font-weight: 800; }
    .container { max-width: 1120px; margin: auto; padding: 14px; }
    .panel-box { background: #16191f; padding: 16px; border-radius: 14px; border: 1px solid #282d37; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #282d37; font-size: 13px; }
    th { background: #ff6600; color: #000; }
    .btn-wa { background: #25D366; color: #000; padding: 6px 12px; border-radius: 6px; font-weight: bold; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
<header>
  <h1>👑 GoParcel Master Panel - OTP डॅशबोर्ड</h1>
</header>

<div class="container">
  <div class="panel-box" style="overflow-x:auto;">
    <h3 style="color:#ff6600; margin-bottom:10px;">🔔 सक्रिय OTP विनंत्या (Live OTP Requests)</h3>
    <table>
      <thead>
        <tr><th>वेळ</th><th>प्रकार</th><th>नाव व मोबाईल</th><th>सक्रिय OTP</th><th>कृती (WhatsApp)</th></tr>
      </thead>
      <tbody id="otpLiveTableBody"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAxfFnHbLimC3PEO5svXvn3sxH7yn9JEAw",
    authDomain: "goparcel-f89b5.firebaseapp.com",
    databaseURL: "https://goparcel-f89b5-default-rtdb.firebaseio.com",
    projectId: "goparcel-f89b5",
    storageBucket: "goparcel-f89b5.firebasestorage.app",
    messagingSenderId: "263428109251",
    appId: "1:263428109251:web:12f001ac4c4e9d71c84376"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  onSnapshot(query(collection(db, "otpRequests"), orderBy("createdAt", "desc")), (snap) => {
    const tbody = document.getElementById('otpLiveTableBody');
    if (!tbody) return;
    tbody.innerHTML = "";
    
    snap.forEach(d => {
      const r = d.data();
      const waMsg = `नमस्कार ${r.name}, तुमचा GoParcel OTP कोड आहे: ${r.otp}. हा कोड ॲपमध्ये टाका.`;
      const waUrl = `https://wa.me/91${r.phone}?text=${encodeURIComponent(waMsg)}`;

      tbody.innerHTML += `<tr style="background:#291a10;">
        <td><b>🕒 ${r.timeStr || ''}</b></td>
        <td>${r.role || ''}</td>
        <td><b>${r.name}</b><br><small>📞 ${r.phone}</small></td>
        <td><b style="color:#ff6600; font-size:18px;">${r.otp}</b></td>
        <td><a href="${waUrl}" target="_blank" class="btn-wa">📲 रायडरला WhatsApp वर पाठवा</a></td>
      </tr>`;
    });
  });
</script>
</body>
</html>
