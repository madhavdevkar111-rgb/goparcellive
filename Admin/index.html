<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GoParcel - Admin Portal</title>
  <link rel="icon" type="image/png" href="https://madhavdevkar111-rgb.github.io/goparcellive/Rider/logo.png">
  <meta name="theme-color" content="#ff6600">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0d0f12; color: #f5f5f5; padding-bottom: 24px; }
    header { background: linear-gradient(135deg, #000000 65%, #261200 100%); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff6600; position: sticky; top: 0; z-index: 999; }
    .brand-title h1 { color: #ff6600; font-size: 19px; font-weight: 800; }
    .container { max-width: 500px; margin: auto; padding: 14px; }
    .card { background: #16191f; padding: 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid #282d37; }
    .stats-grid { display: flex; gap: 8px; text-align: center; margin-bottom: 14px; }
    .s-box { flex: 1; background: #0d0f12; padding: 12px; border-radius: 12px; border: 1px solid #ff6600; }
    button { background: linear-gradient(135deg, #ff6600, #ff8533); color: #000; font-weight: 800; border: none; cursor: pointer; padding: 10px; border-radius: 8px; width: 100%; margin-top: 6px; }
  </style>
</head>
<body>
<header>
  <div class="brand-title"><h1>GoParcel Admin Dashboard</h1></div>
</header>

<div class="container">
  <div class="stats-grid">
    <div class="s-box"><div style="font-size:11px; color:#aaa;">एकूण ऑर्डर्स</div><div style="font-size:18px; color:#2ecc71; font-weight:bold;">12</div></div>
    <div class="s-box"><div style="font-size:11px; color:#aaa;">सक्रिय रायडर्स</div><div style="font-size:18px; color:#4db8ff; font-weight:bold;">5</div></div>
  </div>

  <div class="card">
    <h3 style="color:#ff6600; margin-bottom:10px;">📋 नवीन रायडर अर्ज व पडताळणी</h3>
    <div id="pendingRidersList" style="font-size:13px; color:#ccc; background:#0d0f12; padding:10px; border-radius:8px;">
      सध्या कोणतीही प्रलंबित नोंदणी नाही. सर्व रायडर प्रमाणित आहेत.
    </div>
  </div>

  <div class="card">
    <h3 style="color:#ff6600; margin-bottom:10px;">⚙️ सिस्टीम कंट्रोल</h3>
    <button onclick="alert('डेटा रिफ्रेश केला आहे.')">डेटा सिंक रीफ्रेश करा</button>
  </div>
</div>
</body>
</html>
