<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GP Rider - GoParcel Partner App</title>
  <link rel="icon" type="image/png" href="https://madhavdevkar111-rgb.github.io/goparcellive/Rider/logo.png">
  <meta name="theme-color" content="#ff6600">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0d0f12; color: #f5f5f5; padding-bottom: 24px; }
    header { background: linear-gradient(135deg, #000000 65%, #261200 100%); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff6600; position: sticky; top: 0; z-index: 999; }
    .brand-title h1 { color: #ff6600; font-size: 19px; font-weight: 800; }
    .container { max-width: 500px; margin: auto; padding: 14px; }
    .card { background: #16191f; padding: 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid #282d37; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; background: #0d0f12; padding: 4px; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 10px; background: transparent; color: #999; border-radius: 8px; font-size: 13px; border: none; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: #ff6600; color: #000; font-weight: 800; }
    input[type="text"], input[type="tel"], input[type="number"], select, button, a.wa-btn { width: 100%; padding: 12px 14px; margin: 7px 0; border-radius: 10px; border: 1px solid #2f3542; background: #1e222b; color: #fff; font-size: 14px; display: block; text-align: center; text-decoration: none; }
    input[type="text"], input[type="tel"], input[type="number"], select { text-align: left; }
    button { background: linear-gradient(135deg, #ff6600, #ff8533); color: #000; font-weight: 800; border: none; cursor: pointer; }
    a.wa-btn { background: #25D366; color: #000; font-weight: 800; border: none; }
    .otp-timer-strip { background: #1c2e3d; color: #4db8ff; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; text-align: center; margin: 6px 0; }
    .doc-upload-box { background: #101318; border: 1px solid #333b48; padding: 12px; border-radius: 12px; margin: 8px 0; }
    img.preview-img { width: 100%; max-height: 180px; border-radius: 10px; object-fit: cover; margin-top: 8px; }
    .duty-bar { display: flex; justify-content: space-between; align-items: center; background: #0d0f12; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #2c323d; }
    .hidden { display: none; }
  </style>
</head>
<body>
<header>
  <div class="brand-title"><h1>GP Rider - पार्टनर पोर्टल</h1></div>
</header>

<div class="container">
  <div id="authScreen" class="card">
    <div class="tabs">
      <button id="rTabLogin" class="tab-btn active" onclick="switchRTab('login')">🔑 जुना लॉगिन</button>
      <button id="rTabReg" class="tab-btn" onclick="switchRTab('reg')">📝 नवीन नोंदणी</button>
    </div>

    <!-- जुना रायडर लॉगिन -->
    <div id="rSecLogin">
      <input type="tel" id="rLoginPhone" maxlength="10" placeholder="१० अंकी नोंदणीकृत मोबाईल नंबर">
      <button type="button" onclick="startRiderLoginOtp()">नवीन लॉगिन OTP मागवा</button>
      
      <div id="rLoginOtpBox" class="hidden" style="margin-top:10px; border-top:1px solid #2f3542; padding-top:10px;">
        <div class="otp-timer-strip">⏳ ॲडमिनकडे OTP विनंती पाठवली आहे!</div>
        <a id="rLoginWaBtn" href="#" target="_blank" class="wa-btn" style="margin-bottom:8px;">📲 Admin ला WhatsApp वर मेसेज पाठवा</a>
        <input type="number" id="rLoginOtpInput" placeholder="Admin ने दिलेला ६ अंकी OTP टाका">
        <button type="button" onclick="verifyRiderLoginOtp()" style="background:#2ecc71; margin-top:8px;">डॅशबोर्ड उघडा (Login)</button>
      </div>
    </div>

    <!-- नवीन रायडर नोंदणी -->
    <div id="rSecReg" class="hidden">
      <input type="text" id="rName" placeholder="पूर्ण नाव (आधार कार्डप्रमाणे)">
      <input type="tel" id="rPhone" maxlength="10" placeholder="१० अंकी मोबाईल नंबर">
      <input type="text" id="rVehicle" placeholder="गाडीचा नंबर (उदा. MH12AB1234)">
      <input type="tel" id="rAadhaar" maxlength="12" placeholder="आधार कार्ड नंबर">

      <div class="doc-upload-box">
        <label style="font-size:12px; color:#4db8ff;">🪪 आधार कार्ड (समोरील बाजू):</label>
        <input type="file" accept="image/*" capture="environment" id="aadhaarFrontInput" onchange="previewDoc(event)" style="display:none;">
        <img id="prev_front" class="preview-img hidden">
        <button type="button" onclick="document.getElementById('aadhaarFrontInput').click()" style="background:#162838; color:#4db8ff; font-size:12px;">📷 फोटो काढा</button>
      </div>

      <button type="button" onclick="startRiderRegOtp()">नोंदणी पूर्ण करा व OTP मागवा</button>

      <div id="rRegWaBox" class="hidden" style="margin-top:10px; border-top:1px solid #2f3542; padding-top:10px;">
        <div class="otp-timer-strip">⏳ नोंदणी यशस्वी! WhatsApp द्वारे ॲडमिनकडे OTP मागवा:</div>
        <a id="rRegWaBtn" href="#" target="_blank" class="wa-btn" style="margin-bottom:8px;">📲 ॲडमिनला WhatsApp वर नोंदणी पाठवा</a>
        <input type="number" id="rRegOtpInput" placeholder="Admin ने दिलेला ६ अंकी OTP टाका">
        <button type="button" onclick="verifyRiderRegOtp()" style="background:#2ecc71; margin-top:8px;">OTP तपासा व डॅशबोर्ड उघडा</button>
      </div>
    </div>
  </div>

  <!-- रायडर डॅशबोर्ड -->
  <div id="riderScreen" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <span id="riderLabel" style="font-size:13px; color:#bbb; font-weight:600;">स्वागत आहे!</span>
      <button onclick="location.reload()" style="width:auto; padding:6px 12px; background:#262b36; color:#fff; font-size:12px;">Logout</button>
    </div>
    <div class="duty-bar">
      <div><div id="dutyStatusTag" style="color:#e74c3c; font-size:14px; font-weight:800;">● OFFLINE</div></div>
      <button type="button" id="btnToggleDuty" onclick="toggleRiderDuty()" style="width:auto; padding:8px 16px; background:#2ecc71;">ONLINE या</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAxfFnHbLimC3PEO5svXvn3sxH7yn9JEAw",
    authDomain: "goparcel-f89b5.firebaseapp.com",
    databaseURL: "https://goparcel-f89b5-default-rtdb.firebaseio.com",
    projectId: "goparcel-f89b5",
    storageBucket: "goparcel-f89b5.firebasestorage.app",
    messagingSenderId: "263428109251",
    appId: "1:263428109251:web:12f001ac4c4e9d71c84376"
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const ADMIN_WHATSAPP = "919049505512";

  window.capturedImg = "";
  window.previewDoc = (e) => {
    const file = e.target.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = (ev) => {
        window.capturedImg = ev.target.result;
        const img = document.getElementById('prev_front');
        img.src = ev.target.result;
        img.classList.remove('hidden');
        alert("✅ फोटो यशस्वी घेतला!");
      };
      reader.readAsDataURL(file);
    }
  };

  window.switchRTab = (mode) => {
    const isLogin = mode === 'login';
    document.getElementById('rSecLogin').classList.toggle('hidden', !isLogin);
    document.getElementById('rSecReg').classList.toggle('hidden', isLogin);
    document.getElementById('rTabLogin').classList.toggle('active', isLogin);
    document.getElementById('rTabReg').classList.toggle('active', !isLogin);
  };

  window.startRiderLoginOtp = async () => {
    const phone = document.getElementById('rLoginPhone').value.trim();
    if(!phone || phone.length < 10) { alert("१० अंकी वैध नंबर टाका!"); return; }
    const otp = Math.floor(100000 + Math.random() * 900000).toString();
    const timeStr = new Date().toLocaleTimeString('en-IN');

    try {
      await addDoc(collection(db, "otpRequests"), {
        role: "Rider Login", name: "Existing Rider", phone, otp, createdAt: Date.now(), timeStr, status: "Pending"
      });

      const waMsg = `👑 GoParcel Admin OTP Request:\nनमस्कार Admin, रायडर लॉगिनसाठी (${phone}) OTP मागवला आहे.\n🔐 OTP कोड: ${otp}\nवेळ: ${timeStr}`;
      document.getElementById('rLoginWaBtn').href = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(waMsg)}`;
      document.getElementById('rLoginOtpBox').classList.remove('hidden');
      alert("✅ OTP जनरेट झाला! आता खालील WhatsApp बटणावर क्लिक करा.");
    } catch (err) {
      alert("❌ एरर: " + err.message);
    }
  };

  window.verifyRiderLoginOtp = () => {
    if(!document.getElementById('rLoginOtpInput').value.trim()) { alert("कृपया OTP टाका!"); return; }
    alert("🎉 लॉगिन यशस्वी!");
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('riderScreen').classList.remove('hidden');
  };

  window.startRiderRegOtp = async () => {
    const name = document.getElementById('rName').value.trim();
    const phone = document.getElementById('rPhone').value.trim();
    const aadhaar = document.getElementById('rAadhaar').value.trim();
    const vehicle = document.getElementById('rVehicle').value.trim();
    if(!name || !phone || !aadhaar) { alert("कृपया सर्व माहिती भरा!"); return; }

    const otp = Math.floor(100000 + Math.random() * 900000).toString();
    const timeStr = new Date().toLocaleTimeString('en-IN');

    try {
      await addDoc(collection(db, "pending_riders"), {
        name, phone, aadhaarNo: aadhaar, vehicleNo: vehicle, aadhaarFront: window.capturedImg || "", createdAt: new Date(), status: "Pending"
      });
      await addDoc(collection(db, "otpRequests"), {
        role: "Rider Register", name, phone, otp, createdAt: Date.now(), timeStr, status: "Pending"
      });

      const waMsg = `👑 GoParcel New Registration:\nनाव: ${name}\nमोबाईल: ${phone}\nआधार: ${aadhaar}\n🔐 OTP: ${otp}`;
      document.getElementById('rRegWaBtn').href = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(waMsg)}`;
      document.getElementById('rRegWaBox').classList.remove('hidden');
      alert("✅ नोंदणी सेव्ह झाली आणि ॲडमिनकडे OTP विनंती गेली!");
    } catch (err) {
      alert("❌ एरर: " + err.message);
    }
  };

  window.verifyRiderRegOtp = () => {
    if(!document.getElementById('rRegOtpInput').value.trim()) { alert("कृपया OTP टाका!"); return; }
    alert("🎉 नोंदणी आणि OTP पडताळणी यशस्वी!");
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('riderScreen').classList.remove('hidden');
  };

  window.toggleRiderDuty = () => {
    const tag = document.getElementById('dutyStatusTag');
    const btn = document.getElementById('btnToggleDuty');
    if(tag.innerText.includes("OFFLINE")) {
      tag.innerText = "● ONLINE (ड्युटी चालू)"; tag.style.color = "#2ecc71"; btn.innerText = "OFFLINE या"; btn.style.background = "#e74c3c";
    } else {
      tag.innerText = "● OFFLINE"; tag.style.color = "#e74c3c"; btn.innerText = "ONLINE या"; btn.style.background = "#2ecc71";
    }
  };
</script>
</body>
</html>
